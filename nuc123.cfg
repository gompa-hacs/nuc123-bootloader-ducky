# Raspberry Pi Zero BCM2835 GPIO bitbang adapter
adapter driver bcm2835gpio
adapter gpio swclk 14
adapter gpio swdio 15
adapter gpio srst 18
transport select swd
adapter speed 1000

reset_config srst_only

# Housekeeping stuff for OpenOCD targeting Nuvoton NUC123 , NUC126 and others.
# by Ein Terakawa <applause@elfmimi.jp>
# based on TheLastMutt's mini51.cfg

source [find target/numicro.cfg]

#load_script mem_helper.tcl
proc mrw {reg} {
     set value ""
     mem2array value 32 $reg 1
     return $value(0)
}
add_usage_text mrw "address"
add_help_text mrw "Returns value of word in memory."

proc GetPartName {id} {
    set parts([expr 0x12305]) "NUC123SC2AN1"
    set parts([expr 0x12315]) "NUC123SD4AN0"
    set parts([expr 0x12325]) "NUC123LC2AN1"
    set parts([expr 0x12335]) "NUC123LD4AN0"
    set parts([expr 0x12345]) "NUC123ZC2AN1"
    set parts([expr 0x12355]) "NUC123ZD4AN0"
    set parts([expr 0x10012305]) "NUC123SC2AE1"
    set parts([expr 0x10012315]) "NUC123SD4AE0"
    set parts([expr 0x10012325]) "NUC123LC2AE1"
    set parts([expr 0x10012335]) "NUC123LD4AE0"
    set parts([expr 0x10012345]) "NUC123ZC2AE1"
    set parts([expr 0x10012355]) "NUC123ZD4AE0"
    if [info exists parts($id)] {
        return $parts($id)
    } else {
        return ""
    }
}

# Tcl open() does not expand '~' — use this before open
proc resolve_path {path} {
    if {[string index $path 0] eq "~"} {
        if {[string length $path] == 1} {
            return $::env(HOME)
        }
        if {[string index $path 1] eq "/"} {
            return [file join $::env(HOME) [string range $path 2 end]]
        }
    }
    return [file normalize $path]
}

proc InitandUnlock {} {
    mww 0xe000edf0 0x05f0003
    mww 0xe0002008 0x000000
    mww 0xe000200C 0x000000
    mww 0xe0002010 0x000000
    mww 0xe0002014 0x000000
    mww 0x50000100 0x59
    mww 0x50000100 0x16
    mww 0x50000100 0x88
}

proc ReadViaISP {adr} {
    mww 0x5000c000 0x39
    mww 0x5000c00c 0x00
    mww 0x5000c004 $adr 
    mww 0x5000c010 1
    while {[mrw 0x5000c010] != 0} { puts stderr "." }
    set out [mrw 0x5000c008]
    mww 0x5000c000 0x00
    return $out
}

proc WriteViaISP {adr dat} {
    mww 0x5000c000 0x79
    mww 0x5000c00c 0x21
    mww 0x5000c004 $adr  
    mww 0x5000c008 $dat  
    mww 0x5000c010 1
    while {[mrw 0x5000c010] != 0} { puts stderr "." }
    if {[mrw 0x5000c000] & 0x40} { error "ISP Error" }
    mww 0x5000c000 0x00
}

proc PageErase {adr} {
    mww 0x5000c000 0x79
    mww 0x5000c00c 0x22
    mww 0x5000c004 $adr  
    mww 0x5000c010 1
    sleep 20
    while {[mrw 0x5000c010] != 0} { puts stderr "."; sleep 10 }
    if {[mrw 0x5000c000] & 0x40} { error "ISP Error" }
    mww 0x5000c000 0x00
}

proc WriteConfigRegsImpl {conf0 args} {
    InitandUnlock
    set prev_conf0 [ReadViaISP 0x300000]
    if {($prev_conf0 & 2) == 0} {
        puts [format "Config0 (0x00300000):0x%X" $prev_conf0]
        puts [format "Config1 (0x00300004):0x%X" [ReadViaISP 0x300004]]
        error "Flash is locked! Run ChipErase first."
    }
    foreach arg $args {
        if [info exists conf1] {
            error "Too many arguments"
        }
        set conf1 $arg
    }
    if {![info exists conf1]} {
        set conf1 [ReadViaISP 0x300004]
    }
    PageErase 0x300000
    WriteViaISP 0x300000 $conf0
    WriteViaISP 0x300004 $conf1
}

proc WriteConfigRegs {conf0 args} {
    init
    halt
    set id [mrw 0x50000000]
    set part [GetPartName $id]
    if {$part != ""} {
        puts [format "Device ID (PDID) :0x%08X (%s)" $id $part]
    } else {
        puts [format "Device ID (PDID) :0x%08X" $id]
    }
    WriteConfigRegsImpl $conf0 {*}$args
    puts "Configuration registers have been Written"
}

proc ReadConfigRegs {} {
    init
    puts "Reading Configuration registers."
    set id [mrw 0x50000000]
    set part [GetPartName $id]
    if {$part != ""} {
        puts [format "Device ID (PDID) :0x%08X (%s)" $id $part]
    } else {
        puts [format "Device ID (PDID) :0x%08X" $id]
    }
    halt
    InitandUnlock
    set conf0 [ReadViaISP 0x300000]
    set conf1 [ReadViaISP 0x300004]
    puts [format "Config0 (0x00300000):0x%X" $conf0]
    puts [format "Config1 (0x00300004):0x%X" $conf1]
}

proc ChipErase {} {
    init
    halt
    InitandUnlock
    set conf0 [ReadViaISP 0x300000]
    if {$conf0 & 2} {
        puts "Flash is not locked."
    } else {
        puts "Flash is locked! Erasing anyway."
    }
    mww 0x5000c000 0x79
    mww 0x5000c01c 0x01
    if {[mrw 0x5000c000] & 0x40} { error "ISP Error" }
    if {[mrw 0x5000c010] != 0} { error "ISP Busy error" }
    mww 0x5000c00c 0x26
    mww 0x5000c004 0
    puts "Performing chip erase."
    mww 0x5000c010 1
    sleep 50
    while {[mrw 0x5000c010] != 0} { puts stderr "."; sleep 10 }
    if {[mrw 0x5000c000] & 0x40} { error "ISP Error" }
    mww 0x5000c000 0x00
    mww 0x5000c01c 0
    puts "ChipErase complete."
}

proc SysReset {args} {
    init
    foreach arg $args {
        set a [string tolower $arg]
        if {$a eq "ldrom"} {
            set ldrom 1
        } elseif {$a eq "aprom"} {
            set aprom 1
        } elseif {$a eq "cpu"} {
            set cpurst 1
        } elseif {$a eq "chip" || $a eq "por"} {
            set chiprst 1
        } elseif {$a eq "run"} {
            set run 1
        } elseif {$a eq "halt"} {
            set halt 1
        } else {
            error "Unexpected argument '$arg'"
        }
    }
    halt
    InitandUnlock
    if {[info exists chiprst]} {
        mww 0x50000008 [expr {[mrw 0x50000008] | 0x01}]
    } else {
        if {[info exists aprom]} {
            mww 0x5000c000 [expr {[mrw 0x5000c000] & ~0x02}]
        }
        if {[info exists ldrom]} {
            mww 0x5000c000 [expr {[mrw 0x5000c000] | 0x02}]
        }
        if {[info exists cpurst]} {
            mww 0x50000008 [expr {[mrw 0x50000008] | 0x02}]
        } elseif {[info exists run]} {
            reset run
        } elseif {[info exists halt]} {
            reset halt
        } else {
            reset
        }
    }
}

# Show LDROM vector table via debug MEM (ground truth for CPU boot).
proc CheckLDROM {} {
    halt
    set sp [mrw 0x00100000]
    set rv [mrw 0x00100004]
    puts [format "LDROM @0x00100000: SP=0x%08X Reset=0x%08X" $sp $rv]
    if {$sp != 0x20000400} {
        puts "ERROR: stack pointer should be 0x20000400"
    }
    if {($rv & 0xFFF00000) != 0x00100000} {
        puts "ERROR: reset vector should be 0x00100xxx, not APROM address"
    }
}

# Flash LDROM from Intel HEX. The .hex already has base 0x00100000 (record type 04).
# Do NOT pass a second offset — OpenOCD adds it and writes to 0x00200000 instead.
proc ProgramLDROM {filename} {
    init
    halt
    InitandUnlock
    set filename [resolve_path $filename]
    if {![file exists $filename]} {
        error "File not found: $filename\nWhen using sudo, ~ is /root — use /home/gompa/... or copy the hex there."
    }
    IspEnableLDROM
    puts "Erasing LDROM page..."
    PageErase 0x00100000
    puts "Programming $filename (hex base address is inside file)..."
    program $filename
    puts "Programming finished."
    CheckLDROM
}

# Erase all of APROM (32KB). LDROM + config untouched.
proc EraseAPROM {} {
    init
    halt
    InitandUnlock
    puts "Erasing APROM..."
    mww 0x5000c000 0x79
    mww 0x5000c01c 0x01
    if {[mrw 0x5000c000] & 0x40} { error "ISP Error" }
    mww 0x5000c00c 0x26
    mww 0x5000c004 0
    mww 0x5000c010 1
    sleep 50
    while {[mrw 0x5000c010] != 0} { puts stderr "."; sleep 10 }
    if {[mrw 0x5000c000] & 0x40} { error "ISP Error" }
    mww 0x5000c000 0x00
    mww 0x5000c01c 0
    puts "APROM erase complete."
}

# Write APROM .bin via ISP (erases APROM first).
proc WriteAPROM {filename} {
    init
    halt
    InitandUnlock
    set filename [resolve_path $filename]
    set f [open $filename rb]
    set filesize [file size $filename]
    puts [format "File size: 0x%X bytes" $filesize]

    puts "Erasing APROM..."
    mww 0x5000c000 0x79
    mww 0x5000c01c 0x01
    if {[mrw 0x5000c000] & 0x40} { error "ISP Error" }
    mww 0x5000c00c 0x26
    mww 0x5000c004 0
    mww 0x5000c010 1
    sleep 50
    while {[mrw 0x5000c010] != 0} { puts stderr "."; sleep 10 }
    if {[mrw 0x5000c000] & 0x40} { error "ISP Error" }
    mww 0x5000c000 0x00
    mww 0x5000c01c 0

    for {set adr 0} {$adr < $filesize} {incr adr 4} {
        set data [read $f 4]
        if {[string length $data] < 4} {
            append data [string repeat "\xff" [expr {4 - [string length $data]}]]
        }
        binary scan $data I val
        WriteViaISP [expr {0x00000000 + $adr}] $val
        if {$adr % 256 == 0} { puts [format "Written 0x%X bytes..." $adr] }
    }
    close $f
    puts "APROM write complete."
}

proc bswap32 {w} {
    return [expr {((($w) & 0xff) << 24) | (((($w) >> 8) & 0xff) << 16) | (((($w) >> 16) & 0xff) << 8) | ((($w) >> 24) & 0xff)}]
}

# Enable ISP + LDROM update (LDUEN) before LDROM erase/program via ISP.
proc IspEnableLDROM {} {
    mww 0x5000c000 0x79
}

# Write one word to flash via ISP; pick endianness by readback.
proc IspWriteWord {adr data} {
    WriteViaISP $adr $data
    if {[mrw $adr] != $data} {
        WriteViaISP $adr [bswap32 $data]
    }
    set rb [mrw $adr]
    if {$rb != $data} {
        error "ISP write failed at [format 0x%X $adr]: file 0x%08X flash 0x%08X" $adr $data $rb]
    }
}

# Flash .bin to LDROM at 0x00100000 (preferred — uses OpenOCD flash driver).
proc ProgramLDROMBin {filename} {
    init
    halt
    set filename [resolve_path $filename]
    if {![file exists $filename]} {
        error "File not found: $filename"
    }
    puts "Erasing + programming BIN at 0x00100000: $filename"
    InitandUnlock
    IspEnableLDROM
    PageErase 0x00100000
    if {[mrw 0x00100000] != 0xFFFFFFFF} {
        puts "WARN: after erase expected 0xFFFFFFFF at 0x00100000"
    }
    program $filename 0x00100000
    puts "Programming finished."
    CheckLDROM
    puts "Power-cycle: unplug SWD and USB, then plug USB only."
}

# ISP .bin write (fallback if ProgramLDROMBin fails).
proc WriteLDROM {filename} {
    init
    halt
    InitandUnlock
    IspEnableLDROM
    set filename [resolve_path $filename]
    if {![file exists $filename]} {
        error "File not found: $filename"
    }
    set f [open $filename rb]
    set filesize [file size $filename]
    puts [format "ISP write LDROM, 0x%X bytes" $filesize]
    PageErase 0x00100000
    for {set adr 0} {$adr < $filesize} {incr adr 4} {
        set data [read $f 4]
        if {[string length $data] < 4} {
            append data [string repeat "\xff" [expr {4 - [string length $data]}]]
        }
        binary scan $data I val
        IspWriteWord [expr {0x00100000 + $adr}] $val
        if {$adr == 0} {
            puts [format "First word OK: 0x%08X" $val]
        }
        if {$adr % 256 == 0 && $adr > 0} { puts [format "Written 0x%X bytes..." $adr] }
    }
    close $f
    puts "LDROM ISP write complete."
    CheckLDROM
}

if 0 { }